name: opencode-triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level env: composite action steps inherit it (step-level env on a
    # uses: step is not propagated).
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    # Triage runs only for new requests from trusted humans.
    # Tickets prepared by the to-spec/to-tickets skills are opened with the
    # ready-for-agent label and are skipped (label is present at `opened`).
    if: |
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode triage
        uses: anomalyco/opencode/github@latest
        with:
          model: groq/llama-3.1-8b-instant
          share: false
          prompt: |
            Триаж нового обращения #${{ github.event.issue.number }} этого
            репозитория (сервис записи на встречи: фронтенд apps/web, бэкенд
            apps/api, термины в GLOSSARY.md). Не исследуй код без
            необходимости.

            1. Прочитай issue.
            2. Если это готовый тикет скиллов (есть метка ready-for-agent или
               секции Parent/Blocked by в теле) — ответь одним коротким
               комментарием «тикет готов к работе» и завершай.
            3. Иначе ВЫПОЛНИ инструментом shell две команды (без них триаж
               не засчитывается — недостаточно описать выбор в тексте):
               а) поставь ровно одну метку:
                  gh issue edit ${{ github.event.issue.number }} --add-label <label>
                  где <label> одна из:
                  - needs-info — не хватает данных;
                  - ready-for-agent — задача полностью специфицирована;
                  - ready-for-human — нужна ручная реализация;
                  - wontfix — делать не будем.
               б) опубликуй комментарий (2-3 предложения: что просит
                  пользователь и почему выбрана метка; при needs-info —
                  1-3 уточняющих вопроса):
                  gh issue comment ${{ github.event.issue.number }} --body "<текст>"
            4. Финальным сообщением коротко подтверди, какие команды
               выполнены.
