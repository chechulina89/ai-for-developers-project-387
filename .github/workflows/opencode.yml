name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

concurrency:
  # The agent's own reply is a new issue_comment/pull_request_review_comment
  # event from a bot. Without the author type in the group, that no-op bot
  # run (skipped by the job condition) would cancel the still-running real
  # run that produced the reply.
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.user.type }}
  cancel-in-progress: true

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The opencode free-tier models need no provider key.
    env: {}
    # Only trusted humans can invoke the agent:
    # - bot comments are ignored
    # - only OWNER, MEMBER or COLLABORATOR associations pass, so untrusted
    #   fork contributors never reach the step that receives secrets
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/oc') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode/mimo-v2.6-flash-free
          mentions: /oc,/opencode
          share: false
