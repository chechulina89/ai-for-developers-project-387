name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level env: composite action steps inherit it (step-level env on a
    # uses: step is not propagated into a composite action).
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      VAR_GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
    # Only trusted humans can invoke the agent:
    # - bot comments are ignored
    # - only OWNER, MEMBER or COLLABORATOR associations pass, so untrusted
    #   fork contributors never reach the step that receives secrets
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/oc') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check model key presence
        run: |
          for name in GEMINI_API_KEY GOOGLE_API_KEY GOOGLE_GENERATIVE_AI_API_KEY VAR_GEMINI_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name present (length ${#value})"
            else
              echo "$name MISSING"
            fi
          done

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        with:
          model: google/gemini-2.5-flash
          mentions: /oc,/opencode
          share: false
