name: browser-verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: browser-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify calendar in Chromium
        id: browser
        run: npx playwright test apps/web/e2e/booking.spec.ts

      - name: Create verification record
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.browser.outcome }}
        run: |
          printf 'head_sha=%s\nresult=%s\n' "$HEAD_SHA" "$RESULT" > browser-verification.txt

      - name: Upload browser verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ github.event.pull_request.head.sha }}
          path: |
            browser-verification.txt
            test-results/
          if-no-files-found: warn
