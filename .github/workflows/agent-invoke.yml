name: Agent Invoke

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: read

env:
  MODEL_API_KEY: ${{ secrets.COPILOT_MODEL_API_KEY }}

concurrency:
  group: agent-invoke-${{ github.issue.number }}
  cancel-in-progress: true

jobs:
  parse-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      command: ${{ steps.parse.outputs.command }}
      valid: ${{ steps.parse.outputs.valid }}
      should-run: ${{ steps.check-access.outputs.should-run }}
    steps:
      - name: Parse command from comment
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Extract /oc <command> pattern
          if [[ "$COMMENT_BODY" =~ ^[[:space:]]*/oc[[:space:]]+(.+)$ ]]; then
            command="${BASH_REMATCH[1]}"
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "command=$(echo "$command" | xargs)" >> $GITHUB_OUTPUT
            echo "✓ Parsed command: $command" >&2
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "command=" >> $GITHUB_OUTPUT
            echo "✗ Comment does not match /oc <command> pattern" >&2
          fi

      - name: Check contributor access
        id: check-access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Only trusted contributors can invoke agents:
          # - Repository owner
          # - Collaborators with push/admin access
          # - Authors of the issue
          
          ISSUE_AUTHOR="${{ github.event.issue.user.login }}"
          
          # Check if user is the issue author
          if [[ "$ACTOR" == "$ISSUE_AUTHOR" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "✓ User is the issue author" >&2
            exit 0
          fi
          
          # Check if user is repo owner
          if [[ "$ACTOR" == "$REPO_OWNER" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "✓ User is repository owner" >&2
            exit 0
          fi
          
          # Use GitHub API to check collaborator status
          RESPONSE=$(gh api "repos/$REPO_OWNER/$REPO_NAME/collaborators/$ACTOR/permission" \
            --jq '.permission // empty' 2>/dev/null || echo "none")
          
          case "$RESPONSE" in
            admin|maintain|push)
              echo "should-run=true" >> $GITHUB_OUTPUT
              echo "✓ User has collaborator access ($RESPONSE)" >&2
              ;;
            *)
              echo "should-run=false" >> $GITHUB_OUTPUT
              echo "✗ User does not have required access level" >&2
              ;;
          esac

  invoke-agent:
    runs-on: ubuntu-latest
    needs: parse-and-validate
    timeout-minutes: 30
    if: needs.parse-and-validate.outputs.valid == 'true' && needs.parse-and-validate.outputs.should-run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: npm ci

      - name: Post start comment
        id: start-comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMAND: ${{ needs.parse-and-validate.outputs.command }}
        run: |
          COMMENT_BODY="🤖 Running agent with command: \`$COMMAND\`
          
          See workflow run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          COMMENT_ID=$(gh issue comment "$ISSUE_NUMBER" \
            --body "$COMMENT_BODY" \
            --repo "${{ github.repository }}" \
            --json id \
            --jq '.id' \
            2>/dev/null || echo "0")
          
          echo "comment-id=$COMMENT_ID" >> $GITHUB_OUTPUT

      - name: Validate agent configuration
        env:
          COMMAND: ${{ needs.parse-and-validate.outputs.command }}
        run: |
          # Check that required agent config exists
          if [ ! -f "docs/agents/issue-tracker.md" ]; then
            echo "✗ Missing docs/agents/issue-tracker.md" >&2
            exit 1
          fi
          
          if [ ! -f "docs/agents/triage-labels.md" ]; then
            echo "✗ Missing docs/agents/triage-labels.md" >&2
            exit 1
          fi
          
          echo "✓ Agent configuration files found"

      - name: Execute agent command
        id: agent-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMAND: ${{ needs.parse-and-validate.outputs.command }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          
          echo "Executing command: $COMMAND" >&2
          
          # This section can be extended with actual agent invocation logic
          # For now, we validate the setup and prepare for agent execution
          
          case "$COMMAND" in
            triage|review|analyze|fix)
              echo "✓ Command '$COMMAND' recognized" >&2
              ;;
            *)
              echo "⚠ Command '$COMMAND' will be handled by agent processor" >&2
              ;;
          esac
          
          # Store command for result posting
          echo "result=Agent processing command: $COMMAND" >> $GITHUB_OUTPUT

      - name: Post success comment
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          RESULT_BODY="✅ Agent completed successfully

          Command: \`${{ needs.parse-and-validate.outputs.command }}\`
          
          Details: [Workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          gh issue comment "$ISSUE_NUMBER" \
            --body "$RESULT_BODY" \
            --repo "${{ github.repository }}"

      - name: Post failure comment
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          RESULT_BODY="❌ Agent execution failed

          Command: \`${{ needs.parse-and-validate.outputs.command }}\`
          
          Error details: [Workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          gh issue comment "$ISSUE_NUMBER" \
            --body "$RESULT_BODY" \
            --repo "${{ github.repository }}"

  notify-invalid:
    runs-on: ubuntu-latest
    needs: parse-and-validate
    timeout-minutes: 2
    if: needs.parse-and-validate.outputs.valid == 'false' || needs.parse-and-validate.outputs.should-run == 'false'
    steps:
      - name: Post error comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VALID: ${{ needs.parse-and-validate.outputs.valid }}
          ACCESS: ${{ needs.parse-and-validate.outputs.should-run }}
        run: |
          if [[ "$VALID" == "false" ]]; then
            MESSAGE="⚠️ Invalid command format. Use: \`/oc <command>\`
            
            Example: \`/oc triage\`"
          elif [[ "$ACCESS" == "false" ]]; then
            MESSAGE="🔒 You don't have permission to invoke agents. Only repository collaborators and issue authors can run agent commands."
          else
            MESSAGE="⚠️ Invalid request"
          fi
          
          gh issue comment "$ISSUE_NUMBER" \
            --body "$MESSAGE" \
            --repo "${{ github.repository }}"
